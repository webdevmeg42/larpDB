services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: larpdb
      POSTGRES_PASSWORD: larpdb
      POSTGRES_DB: larpdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larpdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://larpdb:larpdb@db:5432/larpdb
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
